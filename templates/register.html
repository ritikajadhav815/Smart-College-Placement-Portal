<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            🎓 Smart Placement Portal
        </a>

        <div class="ms-auto">
            <a href="/" class="btn btn-outline-light btn-sm me-2">Home</a>
            <a href="/login" class="btn btn-light btn-sm">Student Login</a>
        </div>
    </div>
</nav>

<style>

body{
    background:linear-gradient(135deg,#0d6efd,#6ea8fe);
    padding:40px 0;
}

.register-card{
    max-width:700px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:30px;
    font-weight:bold;
}

.btn-success{
    width:100%;
}

.back{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="register-card">

<h2 class="text-primary">
    <i class="bi bi-person-plus-fill"></i>
    Student Registration
</h2>

<p class="text-center text-muted mb-4">
    Create your account to apply for placement opportunities.
</p>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
name="name"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input
type="email"
name="email"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input
type="text"
name="phone"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Department</label>

<input
type="text"
name="department"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Passing Year</label>

<input
type="text"
name="year"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">CGPA</label>

<input
type="text"
name="cgpa"
class="form-control"
required>

</div>

<div class="col-12 mb-3">

<label class="form-label">Skills</label>

<input
type="text"
name="skills"
class="form-control"
placeholder="Example: Python, AWS, Docker"
required>

</div>

<div class="col-12 mb-4">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
required>

</div>

</div>

<button
type="submit"
class="btn btn-success btn-lg w-100">

<i class="bi bi-check-circle-fill"></i>

Register

</button>

</form>

<div class="text-center mt-4">

<p>
Already have an account?

<a href="/login">
Login here
</a>
</p>

<a href="/" class="btn btn-outline-primary">

<i class="bi bi-house-fill"></i>

Back to Home

</a>

</div>

</div>

</div>

<footer class="bg-primary text-white text-center py-3 mt-5">
    <small>
        © 2026 Smart College Placement Portal
        <br>
        Developed by <strong>Ritika Jadhav</strong>
    </small>
</footer>

</body>
</html>
