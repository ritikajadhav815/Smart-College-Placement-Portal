<!DOCTYPE html>
<html>
<head>
    <title>Available Jobs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>💼 Available Placement Opportunities</h1>
</header>

<div class="container">

    <h2>Job Listings</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Company</th>
            <th>Role</th>
            <th>Package</th>
            <th>Skills Required</th>
            <th>Location</th>
            <th>Action</th>
        </tr>


        {% for job in jobs %}

        <tr>
            <td>{{ job.company }}</td>
            <td>{{ job.role }}</td>
            <td>{{ job.package }}</td>
            <td>{{ job.skills }}</td>
            <td>{{ job.location }}</td>

            <td>
                <a href="/apply/{{ job.id }}">
                    <button>Apply</button>
                </a>
            </td>

        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
