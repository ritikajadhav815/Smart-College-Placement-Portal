<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Job</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#198754,#20c997);
    padding:40px 0;
}

.job-card{
    max-width:750px;
    margin:auto;
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h2{
    text-align:center;
    margin-bottom:30px;
    font-weight:bold;
}

.btn-success{
    width:100%;
}

.back{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="container">

<div class="job-card">

<h2>💼 Add New Job</h2>

<form method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Company Name</label>

<input
type="text"
name="company"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Job Role</label>

<input
type="text"
name="role"
class="form-control"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Package</label>

<input
type="text"
name="package"
class="form-control"
placeholder="Example: 8 LPA"
required>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Location</label>

<input
type="text"
name="location"
class="form-control"
placeholder="Example: Pune"
required>

</div>

<div class="col-12 mb-4">

<label class="form-label">Required Skills</label>

<input
type="text"
name="skills"
class="form-control"
placeholder="Example: AWS, Docker, Linux"
required>

</div>

</div>

<button
type="submit"
class="btn btn-success btn-lg">

➕ Add Job

</button>

</form>

<div class="back">

<a href="/admin">⬅ Back to Admin Dashboard</a>

</div>

</div>

</div>

</body>

</html>
