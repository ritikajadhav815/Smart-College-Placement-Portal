<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#212529,#0d6efd);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.login-card h2{
    text-align:center;
    margin-bottom:30px;
    font-weight:bold;
}

.btn-dark{
    width:100%;
}

.back{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="login-card">

<h2>👨‍💼 Admin Login</h2>

<form method="POST">

<div class="mb-3">

<label class="form-label">Username</label>

<input
type="text"
name="username"
class="form-control"
placeholder="Enter admin username"
required>

</div>

<div class="mb-4">

<label class="form-label">Password</label>

<input
type="password"
name="password"
class="form-control"
placeholder="Enter password"
required>

</div>

<button
type="submit"
class="btn btn-dark btn-lg">

Login

</button>

</form>

<div class="back">

<a href="/">⬅ Back to Home</a>

</div>

</div>

</body>

</html>
